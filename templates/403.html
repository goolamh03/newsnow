{% extends 'base.html' %}

{% block content %}
<div class="container py-5 my-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6 text-center">

            <!-- FIXED: Contained the restriction layout inside a polished graphic error card -->
            <div class="card shadow border-0 p-5 bg-white rounded-4">
                <div class="card-body">

                    <!-- Visual Icon Anchor for Access Restriction Alerts -->
                    <div class="mb-4 display-1 text-danger">
                        <svg xmlns="http://w3.org" width="72" height="72" fill="currentColor"
                            class="bi bi-shield-lock-fill" viewBox="0 0 16 16">
                            <path fill-rule="evenodd"
                                d="M8 0c-.69 0-1.843.265-2.928.56-1.11.3-2.229.655-2.887.87a1.54 1.54 0 0 0-1.044 1.262c-.596 4.477.787 7.795 2.465 9.99a11.8 11.8 0 0 0 2.517 2.453c.386.273.744.482 1.048.625.28.132.581.24.829.24s.548-.108.829-.24a7 7 0 0 0 1.048-.625 11.8 11.8 0 0 0 2.517-2.453c1.678-2.195 3.061-5.513 2.465-9.99a1.54 1.54 0 0 0-1.044-1.263 63 63 0 0 0-2.887-.87C9.843.266 8.69 0 8 0m0 5a1.5 1.5 0 0 1 .5 2.915l.385 1.99a.5.5 0 0 1-.491.595h-.788a.5.5 0 0 1-.49-.595l.384-1.99A1.5 1.5 0 0 1 8 5" />
                        </svg>
                    </div>

                    <!-- FIXED: Structured layout typography hierarchy -->
                    <h1 class="h3 fw-bold text-dark mb-3">Access Denied</h1>

                    <p class="text-secondary mb-4" style="line-height: 1.5;">
                        Your current account role does not permit you to access this section or perform this action.
                    </p>

                    <!-- Navigation Action Controls Area -->
                    <div class="d-flex justify-content-center gap-3">
                        <a href="{% url 'article-list' %}" class="btn btn-primary px-4 fw-semibold shadow-sm">
                            Return Home
                        </a>

                        <!-- JavaScript browser validation fallback pathway -->
                        <button onclick="history.back()" class="btn btn-outline-secondary px-4 fw-semibold">
                            Go Back
                        </button>
                    </div>

                </div>
            </div>

        </div>
    </div>
</div>
{% endblock %}
