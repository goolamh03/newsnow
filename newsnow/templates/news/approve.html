{% extends 'base.html' %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-8">

            <!-- FIXED: Added spacing and typography styling -->
            <h1 class="mb-4 h2 text-dark">Approve: {{ article.title }}</h1>

            <div class="card shadow-sm mb-4">
                <!-- FIXED: Wrapped the article content inside a proper card body with neat text styling -->
                <div class="card-body bg-white p-4" style="line-height: 1.6;">
                    <div class="article-text text-secondary mb-0">
                        {{ article.content|linebreaks }}
                    </div>
                </div>

                <!-- FIXED: Separated action buttons into a clean, distinct card footer layout area -->
                <div class="card-footer bg-light p-3 d-flex justify-content-between align-items-center">
                    <!-- Cancel Action Fallback Route Link -->
                    <a href="{% url 'approval-queue' %}" class="btn btn-link text-decoration-none text-muted">
                        Cancel & Return
                    </a>

                    <!-- Secured State Modification POST Form Trigger Block -->
                    <form method="post" class="m-0 p-0">
                        {% csrf_token %}
                        <!-- FIXED: Applied primary styling and cursor weights to the native submit element button -->
                        <button type="submit" class="btn btn-success px-4 fw-bold">
                            Approve and Distribute
                        </button>
                    </form>
                </div>
            </div>

        </div>
    </div>
</div>
{% endblock %}
