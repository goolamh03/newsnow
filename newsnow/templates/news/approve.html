{% extends 'base.html' %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-8">

            <!-- Title Header Layout -->
            <h1 class="mb-4 h2 text-dark fw-bold">Approve: {{ article.title }}</h1>

            <div class="card shadow-sm mb-4 border-0">
                <!-- Content Area Wrapper -->
                <div class="card-body bg-white p-4" style="line-height: 1.6;">
                    <div class="article-text text-secondary mb-0">
                        {{ article.content|linebreaks }}
                    </div>
                </div>

                <!-- Card Actions Footer Area Container -->
                <div class="card-footer bg-light p-3 d-flex flex-wrap justify-content-between align-items-center gap-3">

                    <!-- FIXED: Restored all missing opening <a> tags and upgraded layout nodes to clean button links -->
                    <div class="d-flex gap-2 flex-wrap">

                        <!-- Back Button Component -->
                        <a href="{% url 'approval-queue' %}" class="btn btn-sm btn-outline-secondary px-3 fw-medium">
                            &larr; Back
                        </a>

                        <!-- Edit Button Component -->
                        <a href="{% url 'article-update' article.pk %}"
                            class="btn btn-sm btn-outline-primary px-3 fw-medium">
                            Edit Article
                        </a>

                        <!-- Delete Button Component -->
                        <a href="{% url 'article-delete' article.pk %}"
                            class="btn btn-sm btn-outline-danger px-3 fw-medium">
                            Delete Article
                        </a>

                    </div>

                    <!-- Secure Moderation State POST Submission Form Block -->
                    <form method="post" class="m-0 p-0">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-sm btn-success px-4 fw-bold">
                            Approve and Distribute
                        </button>
                    </form>

                </div>
            </div>

        </div>
    </div>
</div>
{% endblock %}
